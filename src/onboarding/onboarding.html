<!DOCTYPE html>
<!-- Onboarding is deliberately a dark surface regardless of OS preference: it's a
     one-time welcome, and a dark stage is what makes the animated keycaps read as
     the subject. Pinning the attribute here (rather than in JS) avoids a flash of
     the light palette before React mounts. Values still come from tokens.css, so
     it stays the same family as the rest of the UI. -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome - Copy Page Title and URL Pro</title>
</head>
<body class="bg-slate-950">
  <div id="root"></div>
  <script type="module" src="./onboarding.jsx"></script>
</body>
</html>
