      --------------------------------------------------

      ⌨️ СОЧЕТАНИЯ КЛАВИШ ПО УМОЛЧАНИЮ:
      • [ Ctrl + Shift + P ] (Mac: Cmd + Shift + P) — выделенный текст или заголовок и ссылка
      • [ Ctrl + Shift + L ] (Mac: Cmd + Shift + L) — ссылка в Markdown
      • [ Ctrl + Shift + U ] (Mac: Cmd + Shift + U) — выделенный текст в кавычках, заголовок и ссылка
      Любое из них можно изменить или отключить в настройках. Работают и на новой вкладке, и на страницах chrome://.

      📑 ПАКЕТНОЕ КОПИРОВАНИЕ:
