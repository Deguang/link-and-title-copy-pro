      🚀 बार-बार लिंक फ़ॉर्मैट करने का झंझट खत्म। पेज का टाइटल और साफ़ URL सीधे अपने मनपसंद फ़ॉर्मैट में कॉपी करें — एक शॉर्टकट से, या एक साथ अधिकतम पाँच टैब।
      --------------------------------------------------

      ⌨️ डिफ़ॉल्ट शॉर्टकट:
      • [ Ctrl + Shift + P ] (Mac: Cmd + Shift + P) — चुना हुआ टेक्स्ट (या टाइटल) और लिंक
      • [ Ctrl + Shift + L ] (Mac: Cmd + Shift + L) — Markdown लिंक
      • [ Ctrl + Shift + U ] (Mac: Cmd + Shift + U) — उद्धरण चिह्नों में चुना हुआ टेक्स्ट, टाइटल और लिंक
      सेटिंग्स में इन्हें आसानी से बदलें या हटाएँ। ये नए टैब पेज और chrome:// पेजों पर भी सुचारू रूप से काम करते हैं।

      📑 बैच कॉपी:
      ━━━━━━━━━━━━━━━━━━━━━━━━━━
      ▶ पॉपअप खोलें, अधिकतम पाँच टैब चुनें और अपनी किसी भी टेम्पलेट में एक साथ कॉपी करें। टैब स्ट्रिप में पहले से चुने गए टैब अपने-आप चुन लिए जाते हैं।
      ▶ कुल 8 लेआउट: अलग पंक्तियाँ, बुलेट, टास्क लिस्ट, क्रमांकित सूची, Markdown टेबल, HTML टेबल, CSV, JSON।

      ✨ मुख्य फ़ीचर:
      ━━━━━━━━━━━━━━━━━━━━━━━━━━
      ▶ स्मार्ट चयन: चुने हुए टेक्स्ट को प्राथमिकता देता है, कुछ न चुना हो तो पेज टाइटल कॉपी करता है।
      ▶ सबसे छोटा काम करने वाला लिंक: {url:short} ट्रैकिंग हटाता है और Amazon, YouTube, Stack Overflow, Reddit, eBay, Etsy, Walmart, Target व Hobby Lobby पर साइट का अपना छोटा रूप इस्तेमाल करता है।
      ▶ अपने छोटा करने के नियम: बिना रेगुलर एक्सप्रेशन के पाथ सेगमेंट से नियम लिखें — या एक लंबा URL और एक काम करने वाला छोटा URL चिपकाएँ, नियम अपने-आप तैयार हो जाएगा।
      ▶ साफ़ लिंक: {url:notrack} UTM और दूसरे ट्रैकिंग पैरामीटर हटाता है, पर पेज के लिए ज़रूरी पैरामीटर सुरक्षित रखता है।
      ▶ यूज़र द्वारा लिखे गए टेम्पलेट: Markdown, HTML, Jira या किसी भी फ़ॉर्मैट में टेम्पलेट लिखें, जिसमें {title}, {url}, {selectedText}, {url:domain}, {url:path} जैसे प्लेसहोल्डर और चयन होने या न होने पर दिखने वाले ब्लॉक शामिल हैं। टाइप करते समय प्लेसहोल्डर रंगीन दिखते हैं, जिससे टाइपो तुरंत पकड़ में आ जाता है।
      ▶ राइट-क्लिक मेनू: पेज, चुना हुआ टेक्स्ट या कोई भी लिंक, बिना खोले, अपने फ़ॉर्मैट में कॉपी करें।
      ▶ लाइट और डार्क: पॉपअप और सेटिंग्स सिस्टम थीम के अनुसार अपने-आप ढलते हैं।

      🔒 गोपनीयता:
      कोई अकाउंट नहीं, कोई एनालिटिक्स नहीं। आपके टेम्पलेट और कॉपी किए गए पेज आपके ब्राउज़र में ही रहते हैं।

      🌏 भाषाएँ:
      English, 简体中文, 繁體中文, 日本語, 한국어, Русский, हिन्दी, Deutsch, Español।
