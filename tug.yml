      ▶ VORLAGEN, DIE SIE SCHREIBEN: Markdown, HTML, Jira oder alles andere – mit {title}, {url}, {selectedText}, {url:domain}, {url:path} und mehr, plus Blöcken, die nur mit (oder ohne) Auswahl erscheinen. Platzhalter werden beim Tippen farblich hervorgehoben, sodass Tippfehler sofort auffallen.
