      ▶ САМАЯ КОРОТКАЯ РАБОЧАЯ ССЫЛКА: {url:short} убирает трекинг и использует собственную короткую форму сайта на Amazon, YouTube, Stack Overflow, Reddit, eBay, Etsy, Walmart, Target и Hobby Lobby.
      ▶ СВОИ ПРАВИЛА СОКРАЩЕНИЯ: Пишутся по сегментам пути, без регулярных выражений. Или вставьте длинный URL и работающий короткий — правило будет выведено автоматически.
      ▶ ЧИСТЫЕ ССЫЛКИ: {url:notrack} удаляет UTM и другие параметры отслеживания, сохраняя нужные странице.
      ▶ СВОИ ШАБЛОНЫ: Markdown, HTML, Jira или что угодно — {title}, {url}, {selectedText}, {url:domain}, {url:path} и другие, а также блоки, которые появляются только при наличии (или отсутствии) выделения. Плейсхолдеры подсвечиваются при вводе, так что опечатку видно сразу.
      ▶ КОНТЕКСТНОЕ МЕНЮ: Копируйте страницу, выделение или любую ссылку в своём формате — не открывая ссылку.
      ▶ СВЕТЛАЯ И ТЁМНАЯ ТЕМЫ: Всплывающее окно и настройки следуют теме системы.

      🔒 КОНФИДЕНЦИАЛЬНОСТЬ:
      Без аккаунта и без аналитики. Шаблоны и копируемые страницы остаются в вашем браузере.

      🌏 ЯЗЫКИ:
      English, 简体中文, 繁體中文, 日本語, 한국어, Русский, हिन्दी, Deutsch, Español.
