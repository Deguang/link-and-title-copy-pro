version: "1.0"
source:
  repository: https://github.com/Deguang/link-and-title-copy-pro
  changelog_locale: en
  release_tag: v1.13.0
global:
  category: tools
  support_email: better_li@live.com
  privacy_policy_url: https://app.lideguang.com/link-and-title-copy-pro/privacy.html
  home_page_url: https://app.lideguang.com/link-and-title-copy-pro/
privacy:
  permissions:
    clipboardWrite: Writes the formatted title and link to the clipboard when you press a shortcut, use the popup or pick a right-click menu entry.
    activeTab: Reads the title, URL and selected text of the tab you are copying from, only when you trigger a copy.
    tabs: Lists the open tabs' titles and URLs in the popup so you can copy several of them at once, and finds the tabs you selected in the tab strip.
    scripting: Runs the copy in the current page so the selected text can be read and the clipboard written, including in pages that were open before the extension was installed or updated.
    contextMenus: Adds your templates to the right-click menu for the page, a selection, or any link.
    storage: Saves your templates, shortcuts, link-shortening rules and batch layout locally in the browser.
    notifications: Confirms a copy, or reports one that failed, on pages where no in-page notice can be shown, such as the new tab page and chrome:// pages.
    offscreen: Writes to the clipboard on pages where scripts cannot run, such as the new tab page, chrome:// pages and the Web Store.
  host_permissions:
    "http://*/*": The copy shortcut has to work on whatever page you are reading. The extension only reads the page's title, URL and your selection, and only when you copy.
    "https://*/*": The copy shortcut has to work on whatever page you are reading. The extension only reads the page's title, URL and your selection, and only when you copy.
  data_usage:
    single_purpose: true
    sell_data: false
assets:
  icon_128: ./src/icons/icon.webp
  screenshots:
    - ./docs/images/chromeStore-toast.png
    - ./docs/images/chromeStore-paste.png
    - ./docs/images/chromeStore-config.png
  promo_small: ./docs/images/toast_440x280.png
  promo_large: ./docs/images/easy_copy_1400x560.png
locales:
  en:
    name: "Copy Page Title and URL Pro: Markdown & Custom Link"
    short_description: Copy title & URL as Markdown, HTML, or Jira. Clean tracking params (UTM), custom templates, and smart selection support.
    description: |
      🚀 Stop reformatting links by hand. Copy clean page titles and URLs ready to paste — instantly with one shortcut, or batch-copy up to five tabs at once.
      --------------------------------------------------

      ⌨️ DEFAULT SHORTCUTS:
      • [ Ctrl + Shift + P ] (Mac: Cmd + Shift + P) — Selected text (or page title) + link
      • [ Ctrl + Shift + L ] (Mac: Cmd + Shift + L) — Markdown link
      • [ Ctrl + Shift + U ] (Mac: Cmd + Shift + U) — Quoted selection + title + link
      Change or clear any shortcut in Settings. Works on the new tab page and chrome:// pages too.

      📑 BATCH COPY:
      ━━━━━━━━━━━━━━━━━━━━━━━━━━
      ▶ Open the popup, tick up to five tabs, and copy them together in any template you choose. Tabs already selected in your tab strip are pre-selected for you.
      ▶ Eight layouts: separate lines, bullets, task list, numbered list, Markdown table, HTML table, CSV, JSON.

      ✨ KEY FEATURES:
      ━━━━━━━━━━━━━━━━━━━━━━━━━━
      ▶ SMART SELECTION: Copies your selected text, or falls back to the page title when nothing is selected.
      ▶ SHORTEST WORKING LINK: {url:short} removes tracking and uses the site's own short form on Amazon, YouTube, Stack Overflow, Reddit, eBay, Etsy, Walmart, Target and Hobby Lobby.
      ▶ CUSTOM SHORTENING RULES: Write rules by path segment without regex — or paste a long URL and a working short one, and the rule is inferred for you.
      ▶ CLEAN LINKS: {url:notrack} strips UTM and other tracking parameters but keeps the ones the page needs.
      ▶ TEMPLATES YOU WRITE: Write your own templates for Markdown, HTML, Jira or anything else, using {title}, {url}, {selectedText}, {url:domain}, {url:path} and more, plus conditional blocks with or without selection. Placeholders are colour-highlighted as you type, so typos show straight away.
      ▶ RIGHT-CLICK MENU: Copy the page, your selection, or any link in your format — without opening the link.
      ▶ LIGHT & DARK: The popup and settings follow your system theme.

      🔒 PRIVACY:
      No account, no analytics. Your templates and copied pages stay in your browser.

      🌏 MULTILINGUAL:
      English, 简体中文, 繁體中文, 日本語, 한국어, Русский, हिन्दी, Deutsch, Español.
    changelog: |
      1.13.0
      - Custom shortening rules can now be written by path segment instead of regex
      - Paste a long URL and a working short one to infer rules automatically
      - The rules page strikes through the parts of a URL that were dropped and names the rule that did it
      - Template placeholders are now colour-highlighted as you type to catch typos instantly
      - Templates without shortcuts now appear in the popup and right-click menu
      - Right-click menu entries no longer point at the wrong template when a shortcut is cleared
      - The extension icon stays legible on dark backgrounds
  zh_CN:
    name: "网页标题与链接复制 Pro: 支持 Markdown"
    short_description: 一键复制网页标题与链接。支持 Markdown、HTML、Jira 格式。自动去除 UTM 追踪参数，自定义模板，提升开发与写作效率。
    description: |
      🚀 告别手动调整格式与清理网址。以你需要的格式一键复制网页标题与纯净链接 —— 快捷键秒复制，或一次批量复制最多五个标签页。
      --------------------------------------------------

      ⌨️ 默认快捷键：
      • [ Ctrl + Shift + P ]（Mac: Cmd + Shift + P）—— 选中文本（未选中时为标题）加链接
      • [ Ctrl + Shift + L ]（Mac: Cmd + Shift + L）—— Markdown 链接
      • [ Ctrl + Shift + U ]（Mac: Cmd + Shift + U）—— 带引号的选中文本，加标题和链接
      可在设置中随时修改或清除。新标签页和 chrome:// 页面上同样可用。

      📑 批量复制：
      ━━━━━━━━━━━━━━━━━━━━━━━━━━
      ● 打开弹窗，勾选最多五个标签页，套用任一模板合并复制。标签栏中已选中的标签页会被自动预先勾选。
      ● 八种排列方式：分行、项目符号、任务清单、编号列表、Markdown 表格、HTML 表格、CSV、JSON。

      ✨ 核心功能：
      ━━━━━━━━━━━━━━━━━━━━━━━━━━
      ● 智能提取：优先复制选中文本；没有选中时自动使用网页标题。
      ● 可用的最短链接：{url:short} 去除冗余追踪参数，并在 Amazon、YouTube、Stack Overflow、Reddit、eBay、Etsy、Walmart、Target、Hobby Lobby 上使用站点官方的短链形式。
      ● 自定义短链规则：按路径段书写，无需正则表达式；也可以贴上长网址和一个可用的短网址，系统自动推导规则。
      ● 纯净链接：{url:notrack} 移除 UTM 等追踪参数，同时保留页面访问必需的参数。
      ● 自写模板：自由编写 Markdown、HTML、Jira 或任何格式，支持 {title}、{url}、{selectedText}、{url:domain}、{url:path} 等占位符，以及有选中或无选中的条件块。占位符在输入时按类型着色，拼写错误当场可见。
      ● 右键菜单：以你的格式复制当前页、选中文本或页面上的任意链接 —— 无需打开链接。
      ● 浅色 / 深色：弹窗与设置页自动跟随系统主题。

      🔒 隐私：
      无需账号，无任何数据统计。你的模板和复制的页面只留在你的浏览器本地。

      🌏 多语言：
      English、简体中文、繁體中文、日本語、한국어、Русский、हिन्दी、Deutsch、Español。
    changelog: |
      1.13.0
      - 短链规则改为按路径段书写，不再需要正则表达式
      - 粘贴长网址和一个可用的短网址，规则即可自动推导
      - 规则页会划掉网址中被去掉的部分，并标出生效的规则
      - 模板编辑框中的占位符实时按类型着色，拼写错误当场可见
      - 未设置快捷键的模板现在也会显示在弹窗和右键菜单中
      - 修复清除快捷键后右键菜单可能误调用其他模板的问题
      - 优化深色模式下扩展图标的显示对比度
  zh_TW:
    name: "網頁標題與連結複製 Pro: 支援 Markdown"
    short_description: 一鍵複製網頁標題與連結。支援 Markdown、HTML、Jira 格式。自動移除 UTM 追蹤參數，自訂模板，提升開發與寫作效率。
    description: |
      🚀 告別手動調整格式與雜亂網址。以你要貼上的格式一鍵複製網頁標題與乾淨連結 —— 快捷鍵即時複製，亦可批次複製最多五個分頁。
      --------------------------------------------------

      ⌨️ 預設快捷鍵：
      • [ Ctrl + Shift + P ]（Mac: Cmd + Shift + P）—— 選取文字（未選取時為標題）加連結
      • [ Ctrl + Shift + L ]（Mac: Cmd + Shift + L）—— Markdown 連結
      • [ Ctrl + Shift + U ]（Mac: Cmd + Shift + U）—— 帶引號的選取文字，加標題和連結
      可在設定中隨時修改或清除。新分頁和 chrome:// 頁面上同樣可用。

      📑 批次複製：
      ━━━━━━━━━━━━━━━━━━━━━━━━━━
      ● 開啟彈出視窗，勾選最多五個分頁，套用任一模板一起複製。在分頁列中已選取的分頁會自動預先勾選。
      ● 提供 8 種排列方式：分行、項目符號、待辦清單、編號清單、Markdown 表格、HTML 表格、CSV、JSON。

      ✨ 核心功能：
      ━━━━━━━━━━━━━━━━━━━━━━━━━━
      ● 智慧擷取：優先複製選取文字；沒有選取時自動使用網頁標題。
      ● 可用的最短連結：{url:short} 移除冗贅追蹤參數，並在 Amazon、YouTube、Stack Overflow、Reddit、eBay、Etsy、Walmart、Target、Hobby Lobby 上使用網站官方的短連結形式。
      ● 自訂短連結規則：依路徑段書寫，無需正規表示式；也可以貼上長網址和一個可用的短網址，由系統自動推導規則。
      ● 乾淨連結：{url:notrack} 移除 UTM 等追蹤參數，同時保留頁面正常運作必需的參數。
      ● 自寫模板：自由編寫 Markdown、HTML、Jira 或任何格式，支援 {title}、{url}、{selectedText}、{url:domain}、{url:path} 等佔位符，以及有選取或無選取的條件區塊。佔位符輸入時即依類型著色，拼錯當場可見。
      ● 右鍵選單：以你的格式複製目前頁面、選取文字或任意連結 —— 無需開啟連結。
      ● 淺色 / 深色：彈出視窗與設定頁自動跟隨系統主題。

      🔒 隱私：
      無需帳號，無任何數據統計。你的模板和複製的頁面都只留在你的本機瀏覽器裡。

      🌏 多語言：
      English、简体中文、繁體中文、日本語、한국어、Русский、हिन्दी、Deutsch、Español。
    changelog: |
      1.13.0
      - 短連結規則改為依路徑段書寫，不再需要編寫正規表示式
      - 貼上長網址和一個可用的短網址，規則即可自動推導
      - 規則頁會劃掉網址中被移除的部分，並標出生效的規則
      - 模板編輯區的佔位符即時依類型著色，拼錯當場可見
      - 未指派快捷鍵的模板現在也會出現在彈出視窗和右鍵選單中
      - 修復清除快捷鍵後右鍵選單可能指向錯誤模板的問題
      - 改善深色模式下擴充功能圖示的顯示對比度
  ja:
    name: "ページタイトルとURLをコピー Pro: Markdown対応"
    short_description: タイトルとURLをワンクリックでコピー。Markdown、HTML、Jira形式対応。UTMパラメータ自動削除、カスタムテンプレート機能搭載。
    description: |
      🚀 リンクの手動整形はもう不要。貼り付け先に合わせた形式で、ページタイトルとクリーンなURLを瞬時にコピー。ショートカット一つでも、最大5つのタブを一括でも。
      --------------------------------------------------

      ⌨️ デフォルトのショートカット：
      • [ Ctrl + Shift + P ]（Mac: Cmd + Shift + P）— 選択テキスト（未選択時はタイトル）＋ リンク
      • [ Ctrl + Shift + L ]（Mac: Cmd + Shift + L）— Markdown リンク
      • [ Ctrl + Shift + U ]（Mac: Cmd + Shift + U）— 引用符付きの選択テキスト ＋ タイトル ＋ リンク
      設定画面で自由に変更・解除できます。新しいタブや chrome:// ページでもそのまま使えます。

      📑 一括コピー：
      ━━━━━━━━━━━━━━━━━━━━━━━━━━
      ■ ポップアップを開き、最大5つのタブにチェックを入れて好きなテンプレートでまとめてコピー。タブバーで選択済みのタブは自動で事前選択されます。
      ■ 選べる8種類のレイアウト：改行区切り、箇条書き、タスクリスト、番号付きリスト、Markdown 表、HTML 表、CSV、JSON。

      ✨ 主な機能：
      ━━━━━━━━━━━━━━━━━━━━━━━━━━
      ■ スマート抽出：選択テキストがあればそれを優先し、選択がなければページタイトルを取得します。
      ■ 使える最短リンク：{url:short} がトラッキングを除去し、Amazon、YouTube、Stack Overflow、Reddit、eBay、Etsy、Walmart、Target、Hobby Lobby ではサイト公式の短縮形を使います。
      ■ 独自の短縮ルール：正規表現なしでパスの区切りごとに記述。長い URL と動作する短い URL を貼れば、ルールを自動で導き出します。
      ■ クリーン URL：{url:notrack} が UTM などのトラッキングパラメータを削除し、ページに必要なものは残します。
      ■ 自分で書くテンプレート：Markdown、HTML、Jira など何でも自由に作成。{title}、{url}、{selectedText}、{url:domain}、{url:path} などに加え、選択の有無で切り替わる条件ブロックに対応。プレースホルダーは入力中に色分けされ、打ち間違いにすぐ気づけます。
      ■ 右クリックメニュー：ページ、選択テキスト、任意のリンクを、開かずにお好みの形式でコピー。
      ■ ライト / ダーク：ポップアップと設定画面はシステムのテーマに追従します。

      🔒 プライバシー：
      アカウント不要、計測や分析も一切なし。作成したテンプレートもコピーしたページも、ブラウザの外には出ません。

      🌏 多言語対応：
      English、简体中文、繁體中文、日本語、한국어、Русский、हिन्दी、Deutsch、Español。
    changelog: |
      1.13.0
      - 短縮ルールを正規表現ではなくパスの区切りごとに記述できるように改善
      - 長い URL と動作する短い URL を貼るだけで、ルールを自動推出して導出
      - ルール画面で、URL から削除された部分を取り消し線で示し、適用されたルールを表示
      - テンプレート欄のプレースホルダーを色分けし、打ち間違いがその場でわかるように
      - ショートカット未設定のテンプレートもポップアップと右クリックメニューに表示
      - ショートカット解除後に右クリックメニューが別のテンプレートを指す問題を修正
      - ダーク背景でも拡張機能アイコンが見やすいよう視認性を向上
  ko:
    name: "페이지 제목 및 URL 복사 Pro: 마크다운 및 맞춤 링크"
    short_description: 제목과 URL을 마크다운, HTML, Jira 형식으로 복사하세요. 추적 매개변수(UTM) 제거, 맞춤 템플릿, 스마트 선택을 지원합니다.
    description: |
      🚀 매번 번거롭게 링크 서식을 다듬지 마세요. 페이지 제목과 정돈된 URL을 붙여넣을 형식 그대로 즉시 복사 — 단축키 하나로 빠르게, 최대 5개의 탭도 한 번에 일괄 복사합니다.
      --------------------------------------------------

      ⌨️ 기본 단축키:
      • [ Ctrl + Shift + P ] (Mac: Cmd + Shift + P) — 선택한 텍스트(미선택 시 제목) + 링크
      • [ Ctrl + Shift + L ] (Mac: Cmd + Shift + L) — 마크다운 링크
      • [ Ctrl + Shift + U ] (Mac: Cmd + Shift + U) — 따옴표로 감싼 선택 텍스트 + 제목 + 링크
      설정에서 언제든 변경하거나 해제할 수 있습니다. 새 탭 페이지와 chrome:// 페이지에서도 안정적으로 작동합니다.

      📑 일괄 복사:
      ━━━━━━━━━━━━━━━━━━━━━━━━━━
      ▶ 팝업을 열고 최대 5개의 탭을 선택해 원하는 템플릿으로 한꺼번에 복사하세요. 탭 표시줄에서 이미 선택한 탭은 자동으로 사전 체크됩니다.
      ▶ 8가지 레이아웃 지원: 줄 구분, 글머리 기호, 작업 목록, 번호 목록, 마크다운 표, HTML 표, CSV, JSON.

      ✨ 주요 기능:
      ━━━━━━━━━━━━━━━━━━━━━━━━━━
      ▶ 스마트 선택: 선택한 텍스트가 있으면 텍스트를, 선택하지 않았을 때는 페이지 제목을 자동으로 가져옵니다.
      ▶ 작동하는 가장 짧은 링크: {url:short}가 추적 파라미터를 제거하고 Amazon, YouTube, Stack Overflow, Reddit, eBay, Etsy, Walmart, Target, Hobby Lobby에서 사이트 공식 단축 형식을 사용합니다.
      ▶ 나만의 단축 규칙: 정규식 없이 경로 세그먼트 단위로 손쉽게 작성하세요. 긴 URL과 작동하는 짧은 URL을 붙여넣으면 규칙이 자동으로 추론됩니다.
      ▶ 깨끗한 링크: {url:notrack}이 UTM 등 추적 매개변수를 제거하고 페이지에 필요한 핵심 파라미터는 유지합니다.
      ▶ 직접 작성하는 템플릿: 마크다운, HTML, Jira 등 원하는 형식으로 직접 작성하세요. {title}, {url}, {selectedText}, {url:domain}, {url:path} 등과 선택 여부에 따라 나타나는 조건부 블록을 지원합니다. 입력하는 동안 자리표시자에 색이 입혀져 오타를 즉시 확인할 수 있습니다.
      ▶ 우클릭 메뉴: 페이지, 선택한 텍스트, 또는 웹페이지의 어떤 링크든 열지 않고 원하는 형식으로 바로 복사합니다.
      ▶ 라이트 / 다크: 팝업과 설정 화면이 시스템 테마에 맞춰 자동으로 전환됩니다.

      🔒 개인정보 보호:
