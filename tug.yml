  hi:
    name: "पेज टाइटल और URL कॉपी Pro: Markdown सपोर्ट"
    short_description: एक क्लिक में टाइटल और URL कॉपी करें। Markdown, HTML, Jira फॉर्मैट सपोर्ट। UTM पैरामीटर ऑटो-रिमूव, कस्टम टेम्पलेट।
