  hi:
    name: "पेज टाइटल और URL कॉपी Pro: Markdown सपोर्ट"
    short_description: एक क्लिक में टाइटल और URL कॉपी करें। Markdown, HTML, Jira फॉर्मैट सपोर्ट। UTM पैरामीटर ऑटो-रिमूव, कस्टम टेम्पलेट।
    description: |
      🚀 पेज का टाइटल और लिंक उसी फ़ॉर्मैट में कॉपी करें जहाँ आप पेस्ट करते हैं — एक शॉर्टकट से, या एक साथ कई टैब।
      --------------------------------------------------

      ⌨️ डिफ़ॉल्ट शॉर्टकट:
      • [ Ctrl + Shift + P ] (Mac: Cmd + Shift + P) — चुना हुआ टेक्स्ट या टाइटल, और लिंक
      • [ Ctrl + Shift + L ] (Mac: Cmd + Shift + L) — Markdown लिंक
      • [ Ctrl + Shift + U ] (Mac: Cmd + Shift + U) — उद्धरण चिह्नों में चुना हुआ टेक्स्ट, टाइटल और लिंक
      सेटिंग्स में इन्हें बदलें या हटाएँ। ये नए टैब पेज और chrome:// पेजों पर भी काम करते हैं।

      📑 बैच कॉपी:
      ━━━━━━━━━━━━━━━━━━━━━━━━━━
      ▶ पॉपअप खोलें, अधिकतम पाँच टैब चुनें और किसी भी टेम्पलेट में एक साथ कॉपी करें। टैब बार में पहले से चुने गए टैब अपने-आप चुन लिए जाते हैं।
      ▶ आठ लेआउट: अलग पंक्तियाँ, बुलेट, टास्क लिस्ट, क्रमांकित सूची, Markdown टेबल, HTML टेबल, CSV, JSON।

      ✨ मुख्य फ़ीचर:
      ━━━━━━━━━━━━━━━━━━━━━━━━━━
      ▶ स्मार्ट चयन: चुना हुआ टेक्स्ट लेता है, कुछ न चुना हो तो पेज टाइटल।
      ▶ सबसे छोटा काम करने वाला लिंक: {url:short} ट्रैकिंग हटाता है और Amazon, YouTube, Stack Overflow, Reddit, eBay, Etsy, Walmart, Target व Hobby Lobby पर साइट का अपना छोटा रूप इस्तेमाल करता है।
      ▶ अपने छोटा करने के नियम: रेगुलर एक्सप्रेशन के बिना पाथ सेगमेंट से लिखें — या एक लंबा URL और एक काम करने वाला छोटा URL चिपकाएँ, नियम अपने-आप बन जाएगा।
      ▶ साफ़ लिंक: {url:notrack} UTM और दूसरे ट्रैकिंग पैरामीटर हटाता है, पर पेज के लिए ज़रूरी पैरामीटर रखता है।
      ▶ आपके अपने टेम्पलेट: Markdown, HTML, Jira या कुछ भी — {title}, {url}, {selectedText}, {url:domain}, {url:path} आदि, साथ ही ऐसे ब्लॉक जो केवल चयन होने (या न होने) पर दिखते हैं। टाइप करते समय प्लेसहोल्डर रंगीन दिखते हैं, इसलिए गलती तुरंत दिखती है।
      ▶ राइट-क्लिक मेनू: पेज, चुना हुआ टेक्स्ट या कोई भी लिंक, बिना खोले, अपने फ़ॉर्मैट में कॉपी करें।
      ▶ लाइट और डार्क: पॉपअप और सेटिंग्स सिस्टम थीम के अनुसार चलते हैं।

      🔒 गोपनीयता:
      कोई अकाउंट नहीं, कोई एनालिटिक्स नहीं। आपके टेम्पलेट और कॉपी किए गए पेज आपके ब्राउज़र में ही रहते हैं।

      🌏 भाषाएँ:
      English, 简体中文, 繁體中文, 日本語, 한국어, Русский, हिन्दी, Deutsch, Español।
    changelog: |
      1.13.0
      - छोटा करने के नियम अब रेगुलर एक्सप्रेशन के बजाय पाथ सेगमेंट से लिखे जाते हैं
      - लंबा URL और काम करने वाला छोटा URL चिपकाएँ, नियम अपने-आप बनता है
      - नियम पेज दिखाता है कि URL के साथ क्या हुआ, सिर्फ़ नतीजा नहीं
      - टेम्पलेट फ़ील्ड में प्लेसहोल्डर रंगीन, टाइपो तुरंत दिखता है
      - बिना शॉर्टकट वाले टेम्पलेट अब पॉपअप और राइट-क्लिक मेनू में दिखते हैं
      - शॉर्टकट हटाने के बाद राइट-क्लिक मेनू अब गलत टेम्पलेट नहीं चुनता
      - डार्क बैकग्राउंड पर भी एक्सटेंशन आइकन साफ़ दिखता है
  de:
    name: "Seitentitel und URL kopieren Pro: Markdown & benutzerdefinierter Link"
    short_description: Titel & URL als Markdown, HTML oder Jira kopieren. Tracking-Parameter (UTM) entfernen, eigene Vorlagen und intelligente Auswahl.
    description: |
      🚀 Seitentitel und Link im Format kopieren, in das Sie einfügen – mit einem Tastenkürzel oder für mehrere Tabs auf einmal.
      --------------------------------------------------

      ⌨️ STANDARD-TASTENKOMBINATIONEN:
      • [ Strg + Umschalt + P ] (Mac: Cmd + Umschalt + P) – Auswahl oder Titel, dazu der Link
      • [ Strg + Umschalt + L ] (Mac: Cmd + Umschalt + L) – Markdown-Link
      • [ Strg + Umschalt + U ] (Mac: Cmd + Umschalt + U) – markierter Text in Anführungszeichen, mit Titel und Link
      In den Einstellungen änder- oder entfernbar. Funktionieren auch auf der Neuer-Tab-Seite und auf chrome://-Seiten.

      📑 MEHRERE TABS KOPIEREN:
      ━━━━━━━━━━━━━━━━━━━━━━━━━━
      ▶ Popup öffnen, bis zu fünf Tabs anhaken und gemeinsam in einer beliebigen Vorlage kopieren. Tabs, die Sie in der Tableiste bereits markiert haben, sind vorausgewählt.
      ▶ Acht Layouts: einzelne Zeilen, Aufzählung, Aufgabenliste, nummerierte Liste, Markdown-Tabelle, HTML-Tabelle, CSV, JSON.

      ✨ HAUPTFUNKTIONEN:
      ━━━━━━━━━━━━━━━━━━━━━━━━━━
      ▶ INTELLIGENTE AUSWAHL: Nimmt den markierten Text – oder den Seitentitel, wenn nichts markiert ist.
      ▶ KÜRZESTER FUNKTIONIERENDER LINK: {url:short} entfernt Tracking und nutzt auf Amazon, YouTube, Stack Overflow, Reddit, eBay, Etsy, Walmart, Target und Hobby Lobby die seiteneigene Kurzform.
      ▶ EIGENE KÜRZUNGSREGELN: Nach Pfadsegmenten schreiben, ohne Regex – oder eine lange URL und eine funktionierende kurze einfügen, und die Regel wird für Sie abgeleitet.
      ▶ SAUBERE LINKS: {url:notrack} entfernt UTM- und andere Tracking-Parameter, behält aber die, die die Seite braucht.
      ▶ EIGENE VORLAGEN: Markdown, HTML, Jira oder alles andere – mit {title}, {url}, {selectedText}, {url:domain}, {url:path} und mehr, plus Blöcken, die nur mit (oder ohne) Auswahl erscheinen. Platzhalter werden beim Tippen eingefärbt, Tippfehler fallen sofort auf.
      ▶ KONTEXTMENÜ: Seite, Auswahl oder beliebigen Link im eigenen Format kopieren – ohne den Link zu öffnen.
      ▶ HELL & DUNKEL: Popup und Einstellungen folgen dem Systemdesign.

      🔒 DATENSCHUTZ:
      Kein Konto, keine Analyse. Ihre Vorlagen und die kopierten Seiten bleiben in Ihrem Browser.

      🌏 SPRACHEN:
      English, 简体中文, 繁體中文, 日本語, 한국어, Русский, हिन्दी, Deutsch, Español.
    changelog: |
      1.13.0
      - Kürzungsregeln werden nach Pfadsegmenten statt per Regex geschrieben
      - Lange URL und funktionierende kurze einfügen – die Regel wird abgeleitet
      - Die Regelseite zeigt, was mit einer URL passiert ist, nicht nur das Ergebnis
      - Platzhalter im Vorlagenfeld werden eingefärbt, Tippfehler fallen sofort auf
      - Vorlagen ohne Tastenkürzel erscheinen jetzt im Popup und im Kontextmenü
      - Kontextmenü zeigt nach dem Entfernen eines Kürzels nicht mehr auf die falsche Vorlage
      - Das Erweiterungssymbol bleibt auf dunklem Hintergrund gut lesbar
  es:
    name: "Copiar título de página y URL Pro: Markdown y enlace personalizado"
    short_description: Copia título y URL como Markdown, HTML o Jira. Quita parámetros de seguimiento (UTM), plantillas propias y selección inteligente.
    description: |
      🚀 Copia el título y el enlace de una página en el formato donde vas a pegarlo: con un atajo, o varias pestañas a la vez.
      --------------------------------------------------

      ⌨️ ATAJOS PREDETERMINADOS:
      • [ Ctrl + Mayús + P ] (Mac: Cmd + Mayús + P) — tu selección o el título, y el enlace
      • [ Ctrl + Mayús + L ] (Mac: Cmd + Mayús + L) — enlace en Markdown
      • [ Ctrl + Mayús + U ] (Mac: Cmd + Mayús + U) — texto seleccionado entre comillas, con título y enlace
      Puedes cambiarlos o quitarlos en Ajustes. También funcionan en la página de nueva pestaña y en las páginas chrome://.

      📑 COPIA POR LOTES:
      ━━━━━━━━━━━━━━━━━━━━━━━━━━
      ▶ Abre la ventana emergente, marca hasta cinco pestañas y cópialas juntas con cualquier plantilla. Las pestañas que ya seleccionaste en la barra de pestañas vienen marcadas.
      ▶ Ocho formatos de lista: líneas separadas, viñetas, lista de tareas, lista numerada, tabla Markdown, tabla HTML, CSV, JSON.

      ✨ FUNCIONES PRINCIPALES:
      ━━━━━━━━━━━━━━━━━━━━━━━━━━
      ▶ SELECCIÓN INTELIGENTE: Usa el texto seleccionado o, si no hay selección, el título de la página.
      ▶ EL ENLACE MÁS CORTO QUE FUNCIONA: {url:short} elimina el seguimiento y usa la forma corta propia del sitio en Amazon, YouTube, Stack Overflow, Reddit, eBay, Etsy, Walmart, Target y Hobby Lobby.
      ▶ TUS PROPIAS REGLAS DE ACORTADO: Escríbelas por segmentos de ruta, sin expresiones regulares, o pega una URL larga y una corta que funcione y la regla se deduce sola.
      ▶ ENLACES LIMPIOS: {url:notrack} quita UTM y otros parámetros de seguimiento, pero conserva los que la página necesita.
      ▶ PLANTILLAS A TU MEDIDA: Markdown, HTML, Jira o lo que quieras, con {title}, {url}, {selectedText}, {url:domain}, {url:path} y más, además de bloques que solo aparecen con (o sin) selección. Los marcadores se colorean al escribir, así que una errata se ve al instante.
      ▶ MENÚ CONTEXTUAL: Copia la página, tu selección o cualquier enlace en tu formato, sin abrir el enlace.
      ▶ CLARO Y OSCURO: La ventana emergente y los ajustes siguen el tema del sistema.

      🔒 PRIVACIDAD:
      Sin cuenta y sin analíticas. Tus plantillas y las páginas que copias se quedan en tu navegador.

      🌏 IDIOMAS:
      English, 简体中文, 繁體中文, 日本語, 한국어, Русский, हिन्दी, Deutsch, Español.
    changelog: |
      1.13.0
      - Las reglas de acortado se escriben por segmentos de ruta en lugar de con expresiones regulares
      - Pega una URL larga y una corta que funcione, y la regla se deduce sola
      - La página de reglas muestra qué le pasó a la URL, no solo el resultado
      - Los marcadores del campo de plantilla se colorean y las erratas se ven al escribir
      - Las plantillas sin atajo ya aparecen en la ventana emergente y en el menú contextual
      - El menú contextual ya no apunta a otra plantilla tras quitar un atajo
      - El icono de la extensión se distingue bien sobre fondos oscuros
