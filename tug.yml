      - लंबा URL और काम करने वाला छोटा URL चिपकाएँ, नियम अपने-आप तैयार हो जाता है
      - नियम पेज URL के हटाए गए हिस्सों को काटकर दिखाता है और बताता है कि कौन-सा नियम लागू हुआ
      - टेम्पलेट फ़ील्ड में प्लेसहोल्डर रंगीन दिखते हैं, जिससे टाइपो तुरंत पकड़ में आता है
      - बिना शॉर्टकट वाले टेम्पलेट अब पॉपअप और राइट-क्लिक मेनू में भी दिखाई देते हैं
      - शॉर्टकट हटाने के बाद राइट-क्लिक मेनू में गलत टेम्पलेट चुनने की समस्या ठीक की गई
      - डार्क बैकग्राउंड पर भी एक्सटेंशन आइकन स्पष्ट और साफ़ दिखता है
