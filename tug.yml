version: "1.0"
source:
  repository: https://github.com/Deguang/link-and-title-copy-pro
  changelog_locale: en
  release_tag: v1.13.0
global:
  category: tools
  support_email: better_li@live.com
  privacy_policy_url: https://app.lideguang.com/link-and-title-copy-pro/privacy.html
  home_page_url: https://app.lideguang.com/link-and-title-copy-pro/
privacy:
  permissions:
    clipboardWrite: Writes the formatted title and link to the clipboard when you press a shortcut, use the popup or pick a right-click menu entry.
    activeTab: Reads the title, URL and selected text of the tab you are copying from, only when you trigger a copy.
    tabs: Lists the open tabs' titles and URLs in the popup so you can copy several of them at once, and finds the tabs you selected in the tab strip.
    scripting: Runs the copy in the current page so the selected text can be read and the clipboard written, including in pages that were open before the extension was installed or updated.
    contextMenus: Adds your templates to the right-click menu for the page, a selection, or any link.
    storage: Saves your templates, shortcuts, link-shortening rules and batch layout locally in the browser.
    notifications: Confirms a copy, or reports one that failed, on pages where no in-page notice can be shown, such as the new tab page and chrome:// pages.
    offscreen: Writes to the clipboard on pages where scripts cannot run, such as the new tab page, chrome:// pages and the Web Store.
  host_permissions:
    "http://*/*": The copy shortcut has to work on whatever page you are reading. The extension only reads the page's title, URL and your selection, and only when you copy.
    "https://*/*": The copy shortcut has to work on whatever page you are reading. The extension only reads the page's title, URL and your selection, and only when you copy.
  data_usage:
    single_purpose: true
    sell_data: false
assets:
  icon_128: ./src/icons/icon.webp
  screenshots:
    - ./docs/images/chromeStore-toast.png
    - ./docs/images/chromeStore-paste.png
    - ./docs/images/chromeStore-config.png
  promo_small: ./docs/images/toast_440x280.png
  promo_large: ./docs/images/easy_copy_1400x560.png
locales:
  en:
    name: "Copy Page Title and URL Pro: Markdown & Custom Link"
    short_description: Copy title & URL as Markdown, HTML, or Jira. Clean tracking params (UTM), custom templates, and smart selection support.
    description: |
      🚀 Copy a page's title and link in the format you paste into — with one shortcut, or several tabs at once.
      --------------------------------------------------

      ⌨️ DEFAULT SHORTCUTS:
      • [ Ctrl + Shift + P ] (Mac: Cmd + Shift + P) — your selection or the title, plus the link
      • [ Ctrl + Shift + L ] (Mac: Cmd + Shift + L) — Markdown link
      • [ Ctrl + Shift + U ] (Mac: Cmd + Shift + U) — selected text in quotes, with title and link
      Change or clear any of them in Settings. They also work on the new tab page and chrome:// pages.

      📑 BATCH COPY:
      ━━━━━━━━━━━━━━━━━━━━━━━━━━
      ▶ Open the popup, tick up to five tabs and copy them together in any template. Tabs you already selected in the tab strip are picked for you.
      ▶ Eight layouts: separate lines, bullets, task list, numbered list, Markdown table, HTML table, CSV, JSON.

      ✨ KEY FEATURES:
      ━━━━━━━━━━━━━━━━━━━━━━━━━━
      ▶ SMART SELECTION: Copies the text you selected, or the page title when nothing is selected.
      ▶ SHORTEST WORKING LINK: {url:short} removes tracking and uses the site's own short form on Amazon, YouTube, Stack Overflow, Reddit, eBay, Etsy, Walmart, Target and Hobby Lobby.
      ▶ YOUR OWN SHORTENING RULES: Write rules by path segment, no regex — or paste a long URL and a short one that works, and the rule is worked out for you.
      ▶ CLEAN LINKS: {url:notrack} strips UTM and other tracking parameters but keeps the ones the page needs.
      ▶ TEMPLATES YOU WRITE: Markdown, HTML, Jira or anything else, with {title}, {url}, {selectedText}, {url:domain}, {url:path} and more, plus blocks that only appear when text is (or isn't) selected. Placeholders are coloured as you type, so a typo shows straight away.
      ▶ RIGHT-CLICK MENU: Copy the page, your selection, or any link in your format — without opening the link.
      ▶ LIGHT & DARK: The popup and settings follow your system theme.

      🔒 PRIVACY:
      No account, no analytics. Your templates and the pages you copy stay in your browser.

      🌏 MULTILINGUAL:
      English, 简体中文, 繁體中文, 日本語, 한국어, Русский, हिन्दी, Deutsch, Español.
    changelog: |
      1.13.0
      - Shortening rules are written by path segment instead of regex
      - Paste a long URL and a short one that works, and the rule is worked out for you
      - The rules page shows what happened to a URL, not only what came out of it
      - Placeholders in the template field are coloured, so a typo shows where you type it
      - A template without a shortcut now appears in the popup and the right-click menu
      - Right-click menu entries no longer point at the wrong template when a shortcut is cleared
      - The extension mark stays legible on dark backgrounds
  zh_CN:
    name: "网页标题与链接复制 Pro: 支持 Markdown"
    short_description: 一键复制网页标题与链接。支持 Markdown、HTML、Jira 格式。自动去除 UTM 追踪参数，自定义模板，提升开发与写作效率。
    description: |
      🚀 用你要粘贴的格式复制网页标题与链接 —— 一个快捷键搞定，也能一次复制多个标签页。
      --------------------------------------------------

      ⌨️ 默认快捷键：
      • [ Ctrl + Shift + P ]（Mac: Cmd + Shift + P）—— 选中文本或标题，加链接
      • [ Ctrl + Shift + L ]（Mac: Cmd + Shift + L）—— Markdown 链接
      • [ Ctrl + Shift + U ]（Mac: Cmd + Shift + U）—— 带引号的选中文本，加标题和链接
      可在设置中修改或清除。新标签页和 chrome:// 页面上同样可用。

      📑 批量复制：
      ━━━━━━━━━━━━━━━━━━━━━━━━━━
      ● 打开弹窗，勾选最多五个标签页，用任一模板一起复制。你在标签栏里已选中的标签页会被自动勾上。
      ● 八种排列方式：分行、项目符号、任务清单、编号列表、Markdown 表格、HTML 表格、CSV、JSON。

      ✨ 核心功能：
      ━━━━━━━━━━━━━━━━━━━━━━━━━━
      ● 智能提取：有选中文本就用选中文本，没有就用网页标题。
      ● 可用的最短链接：{url:short} 去除追踪参数，并在 Amazon、YouTube、Stack Overflow、Reddit、eBay、Etsy、Walmart、Target、Hobby Lobby 上使用站点官方的短链形式。
      ● 自定义短链规则：按路径段书写，无需正则；也可以贴上长网址和一个可用的短网址，规则自动推导。
      ● 纯净链接：{url:notrack} 去除 UTM 等追踪参数，同时保留页面必需的参数。
      ● 自写模板：Markdown、HTML、Jira 或任何格式，支持 {title}、{url}、{selectedText}、{url:domain}、{url:path} 等占位符，以及「有选中 / 无选中」的条件块。占位符输入时即按类型着色，拼错当场可见。
      ● 右键菜单：以你的格式复制当前页、选中文本或任意链接 —— 无需打开链接。
      ● 浅色 / 深色：弹窗与设置页跟随系统主题。

      🔒 隐私：
      无需账号，无统计。你的模板和复制的页面都只留在你的浏览器里。

      🌏 多语言：
      English、简体中文、繁體中文、日本語、한국어、Русский、हिन्दी、Deutsch、Español。
    changelog: |
      1.13.0
      - 短链规则改为按路径段书写，不再需要正则
      - 贴上长网址和一个可用的短网址，规则自动推导
      - 规则页会展示网址发生了什么，而不只是结果
      - 模板中的占位符按类型着色，拼错当场可见
      - 无快捷键的模板现在会出现在弹窗和右键菜单中
      - 清除快捷键后，右键菜单不再复制成另一个模板
      - 深色下扩展图标不再融进背景
  zh_TW:
    name: "網頁標題與連結複製 Pro: 支援 Markdown"
    short_description: 一鍵複製網頁標題與連結。支援 Markdown、HTML、Jira 格式。自動移除 UTM 追蹤參數，自訂模板，提升開發與寫作效率。
    description: |
      🚀 用你要貼上的格式複製網頁標題與連結 —— 一個快捷鍵搞定，也能一次複製多個分頁。
      --------------------------------------------------

      ⌨️ 預設快捷鍵：
      • [ Ctrl + Shift + P ]（Mac: Cmd + Shift + P）—— 選取文字或標題，加連結
      • [ Ctrl + Shift + L ]（Mac: Cmd + Shift + L）—— Markdown 連結
      • [ Ctrl + Shift + U ]（Mac: Cmd + Shift + U）—— 帶引號的選取文字，加標題和連結
      可在設定中修改或清除。新分頁和 chrome:// 頁面上同樣可用。

      📑 批次複製：
      ━━━━━━━━━━━━━━━━━━━━━━━━━━
      ● 開啟彈出視窗，勾選最多五個分頁，用任一模板一起複製。你在分頁列中已選取的分頁會自動勾上。
      ● 八種排列方式：分行、項目符號、待辦清單、編號清單、Markdown 表格、HTML 表格、CSV、JSON。

      ✨ 核心功能：
      ━━━━━━━━━━━━━━━━━━━━━━━━━━
      ● 智慧擷取：有選取文字就用選取文字，沒有就用網頁標題。
      ● 可用的最短連結：{url:short} 移除追蹤參數，並在 Amazon、YouTube、Stack Overflow、Reddit、eBay、Etsy、Walmart、Target、Hobby Lobby 上使用網站官方的短連結形式。
      ● 自訂短連結規則：依路徑段書寫，無需正規表示式；也可以貼上長網址和一個可用的短網址，規則自動推導。
      ● 乾淨連結：{url:notrack} 移除 UTM 等追蹤參數，同時保留頁面必需的參數。
      ● 自寫模板：Markdown、HTML、Jira 或任何格式，支援 {title}、{url}、{selectedText}、{url:domain}、{url:path} 等佔位符，以及「有選取 / 無選取」的條件區塊。佔位符輸入時即依類型著色，拼錯當場可見。
      ● 右鍵選單：以你的格式複製目前頁面、選取文字或任意連結 —— 無需開啟連結。
      ● 淺色 / 深色：彈出視窗與設定頁跟隨系統主題。

      🔒 隱私：
      無需帳號，無統計。你的模板和複製的頁面都只留在你的瀏覽器裡。

      🌏 多語言：
      English、简体中文、繁體中文、日本語、한국어、Русский、हिन्दी、Deutsch、Español。
    changelog: |
      1.13.0
      - 短連結規則改為依路徑段書寫，不再需要正規表示式
      - 貼上長網址和一個可用的短網址，規則自動推導
      - 規則頁會顯示網址發生了什麼，而不只是結果
      - 模板中的佔位符依類型著色，拼錯當場可見
      - 無快捷鍵的模板現在會出現在彈出視窗和右鍵選單中
      - 清除快捷鍵後，右鍵選單不再複製成另一個模板
      - 深色下擴充功能圖示不再融入背景
  ja:
    name: "ページタイトルとURLをコピー Pro: Markdown対応"
    short_description: タイトルとURLをワンクリックでコピー。Markdown、HTML、Jira形式対応。UTMパラメータ自動削除、カスタムテンプレート機能搭載。
    description: |
      🚀 ページのタイトルとURLを、貼り付け先の形式でコピー。ショートカット一つで、複数のタブもまとめて。
      --------------------------------------------------

      ⌨️ デフォルトのショートカット：
      • [ Ctrl + Shift + P ]（Mac: Cmd + Shift + P）— 選択テキストまたはタイトル＋URL
      • [ Ctrl + Shift + L ]（Mac: Cmd + Shift + L）— Markdown リンク
      • [ Ctrl + Shift + U ]（Mac: Cmd + Shift + U）— 引用符付きの選択テキスト＋タイトル＋URL
      設定画面で変更・解除できます。新しいタブや chrome:// ページでも使えます。

      📑 一括コピー：
      ━━━━━━━━━━━━━━━━━━━━━━━━━━
      ■ ポップアップで最大 5 つのタブにチェックを入れ、好きなテンプレートでまとめてコピー。タブバーで選択済みのタブは自動でチェックされます。
      ■ 8 種類のレイアウト：改行区切り、箇条書き、タスクリスト、番号付きリスト、Markdown 表、HTML 表、CSV、JSON。

      ✨ 主な機能：
      ━━━━━━━━━━━━━━━━━━━━━━━━━━
      ■ スマート抽出：選択したテキストを、選択がなければページタイトルを使います。
      ■ 使える最短リンク：{url:short} がトラッキングを除去し、Amazon・YouTube・Stack Overflow・Reddit・eBay・Etsy・Walmart・Target・Hobby Lobby ではサイト公式の短縮形を使います。
      ■ 独自の短縮ルール：正規表現なしでパスの区切りごとに記述。長い URL と動作する短い URL を貼れば、ルールを自動で導き出します。
      ■ クリーン URL：{url:notrack} が UTM などのトラッキングパラメータを削除し、ページに必要なものは残します。
      ■ 自由なテンプレート：Markdown、HTML、Jira など何でも。{title}、{url}、{selectedText}、{url:domain}、{url:path} などに加え、選択の有無で切り替わるブロックも。プレースホルダーは入力中に色分けされ、打ち間違いにすぐ気づけます。
      ■ 右クリックメニュー：ページ、選択テキスト、任意のリンクを、開かずにお好みの形式でコピー。
      ■ ライト / ダーク：ポップアップと設定画面はシステムのテーマに追従します。

      🔒 プライバシー：
      アカウント不要、計測なし。テンプレートもコピーしたページも、ブラウザの外には出ません。

      🌏 多言語対応：
      English、简体中文、繁體中文、日本語、한국어、Русский、हिन्दी、Deutsch、Español。
    changelog: |
      1.13.0
      - 短縮ルールを正規表現ではなくパスの区切りごとに記述できるように
      - 長い URL と動作する短い URL を貼ると、ルールを自動で導出
      - ルール画面で、URL がどう変わったかを表示
      - テンプレート欄のプレースホルダーを色分けし、打ち間違いがその場でわかるように
      - ショートカットのないテンプレートもポップアップと右クリックメニューに表示
      - ショートカット解除後に右クリックメニューが別のテンプレートを指す問題を修正
      - ダーク背景でも拡張機能アイコンが見やすく
  ko:
    name: "페이지 제목 및 URL 복사 Pro: 마크다운 및 맞춤 링크"
    short_description: 제목과 URL을 마크다운, HTML, Jira 형식으로 복사하세요. 추적 매개변수(UTM) 제거, 맞춤 템플릿, 스마트 선택을 지원합니다.
    description: |
      🚀 붙여 넣을 곳의 형식 그대로 페이지 제목과 링크를 복사하세요. 단축키 하나로, 여러 탭도 한 번에.
      --------------------------------------------------

      ⌨️ 기본 단축키:
      • [ Ctrl + Shift + P ] (Mac: Cmd + Shift + P) — 선택한 텍스트 또는 제목 + 링크
      • [ Ctrl + Shift + L ] (Mac: Cmd + Shift + L) — 마크다운 링크
      • [ Ctrl + Shift + U ] (Mac: Cmd + Shift + U) — 따옴표로 감싼 선택 텍스트 + 제목 + 링크
      설정에서 변경하거나 해제할 수 있습니다. 새 탭 페이지와 chrome:// 페이지에서도 작동합니다.

      📑 일괄 복사:
      ━━━━━━━━━━━━━━━━━━━━━━━━━━
      ▶ 팝업에서 최대 5개의 탭을 선택해 원하는 템플릿으로 한꺼번에 복사하세요. 탭 표시줄에서 이미 선택한 탭은 자동으로 체크됩니다.
      ▶ 8가지 레이아웃: 줄 구분, 글머리 기호, 작업 목록, 번호 목록, 마크다운 표, HTML 표, CSV, JSON.

      ✨ 주요 기능:
      ━━━━━━━━━━━━━━━━━━━━━━━━━━
      ▶ 스마트 선택: 선택한 텍스트가 있으면 그것을, 없으면 페이지 제목을 사용합니다.
      ▶ 작동하는 가장 짧은 링크: {url:short}가 추적 정보를 제거하고 Amazon, YouTube, Stack Overflow, Reddit, eBay, Etsy, Walmart, Target, Hobby Lobby에서는 사이트 공식 단축 형식을 사용합니다.
      ▶ 나만의 단축 규칙: 정규식 없이 경로 단위로 작성하세요. 긴 URL과 작동하는 짧은 URL을 붙여 넣으면 규칙을 자동으로 만들어 줍니다.
      ▶ 깨끗한 링크: {url:notrack}이 UTM 등 추적 매개변수를 제거하고 페이지에 필요한 것은 남깁니다.
      ▶ 직접 쓰는 템플릿: 마크다운, HTML, Jira 등 어떤 형식이든. {title}, {url}, {selectedText}, {url:domain}, {url:path} 등과 선택 여부에 따라 나타나는 블록을 지원합니다. 입력하는 동안 자리표시자에 색이 입혀져 오타가 바로 보입니다.
      ▶ 우클릭 메뉴: 페이지, 선택한 텍스트, 또는 어떤 링크든 열지 않고 원하는 형식으로 복사합니다.
      ▶ 라이트 / 다크: 팝업과 설정 화면이 시스템 테마를 따릅니다.

      🔒 개인정보:
      계정 불필요, 분석 없음. 템플릿과 복사한 페이지는 브라우저 밖으로 나가지 않습니다.

      🌏 다국어 지원:
      English, 简体中文, 繁體中文, 日本語, 한국어, Русский, हिन्दी, Deutsch, Español.
    changelog: |
      1.13.0
      - 단축 규칙을 정규식 대신 경로 단위로 작성
      - 긴 URL과 작동하는 짧은 URL을 붙여 넣으면 규칙 자동 생성
      - 규칙 화면에서 URL이 어떻게 바뀌었는지 표시
      - 템플릿 입력란의 자리표시자 색상 구분으로 오타를 즉시 확인
      - 단축키 없는 템플릿도 팝업과 우클릭 메뉴에 표시
      - 단축키 해제 후 우클릭 메뉴가 다른 템플릿을 가리키던 문제 수정
      - 어두운 배경에서도 확장 프로그램 아이콘이 잘 보이도록 개선
  ru:
    name: "Копировать заголовок и URL Pro: Markdown"
    short_description: Копируйте заголовок и URL одним кликом. Поддержка Markdown, HTML, Jira. Автоудаление UTM-параметров, настраиваемые шаблоны.
    description: |
