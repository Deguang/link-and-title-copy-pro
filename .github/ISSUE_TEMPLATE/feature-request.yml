name: "Feature request"
description: Suggest a new format, placeholder, or improvement
title: "Feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or workflow you'd like this to help with.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like the extension to do?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / workarounds
      description: Anything you've tried, or other approaches you considered.
